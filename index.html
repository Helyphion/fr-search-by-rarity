<!DOCTYPE html>

<html>
<head>
<title>FR Search by Rarity</title>
<!-- TODO: make a proper icon.. eventually -->

<!-- Bootstrap -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

<style>
body {
    background-color: #2e3440;
    color: #d8dee9;
    font-family: arial;
    padding: 1rem
    /*transform: skewX(-1deg);   sometimes I just feel evil..*/
}

form {
    border: 0.1rem solid #d8dee9;
    padding: 0.5rem;
}
</style>
</head>



<body>

<!-- first row of boxes-->
<div class="row">

<div class="col-sm">
    info
</div>

<div class="col-sm">
    <div>util</div>
    <div>m / f</div>
</div>

<div class="col-sm">
    breeds
</div>

</div>

<!-- second row of boxes -->
<div class="row">

    <form id="prim-rarity" class="col-sm">
        <input type="checkbox" name="prim-rarity" value="common-prim">
        <label for="common-prim">Common</label>
        <br>
        <input type="checkbox" name="prim-rarity" value="uncommon-prim">
        <label for="uncommon-prim">Uncommon</label>
        <br>
        <input type="checkbox" name="prim-rarity" value="limited-prim">
        <label for="limited-prim">Limited</label>
        <br>
        <input type="checkbox" name="prim-rarity" value="rare-prim">
        <label for="rare-prim">Rare</label>
    </form>

    <form id="" class="col-sm">
        sec
    </form>

    <form id="" class="col-sm">
        tert
    </form>
    
</div>

<script src="script.js"></script>


<!-- Bootstrap supplementals (possibly not needed?) -->
