<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

<title>FR Search by Rarity</title>
<!-- TODO: make a proper icon.. eventually -->
<link rel="icon" href="favicon.ico">

<!-- Bootstrap -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

<style>
body {
    background-color: #2e3440;
    color: #d8dee9;
    font-family: arial;
    max-width: 50rem; 
    margin: auto;
    /*transform: skewX(-1deg);   sometimes I just feel evil..*/
}

.box {
    border: 0.1rem solid #d8dee9;
    padding: 0.5rem;
    margin: 0.5rem;
}
</style>
</head>



<body>

<!-- first row of boxes-->
<div class="row no-gutters">

    <!-- intro text -->
    <div class="col-12 col-sm-6 col-md-4">
        <div class="box">
            info
        </div>
    </div>

    <!-- utility toggles -->
    <div class="col-12 col-sm-6 col-md-4">
        <div class="box">
            util
        </div>
    </div>

    <!-- breed rarity -->
    <div class="col-12 col-sm-6 col-md-4">
        <div class="box">
            breeds
        </div>
    </div>


    <!-- primary gene rarity -->
    <div class="col-12 col-sm-6 col-md-4">
        <div class="box">

            <div>Primary Rarity</div>
            <form id="prim-rarity">
                <input type="checkbox" name="rarity" value="common">
                <label for="common">Common</label>
                <br>
                <input type="checkbox" name="rarity" value="uncommon">
                <label for="uncommon">Uncommon</label>
                <br>
                <input type="checkbox" name="rarity" value="limited">
                <label for="limited">Limited</label>
                <br>
                <input type="checkbox" name="rarity" value="rare">
                <label for="rare">Rare</label>
            </form>

        </div>
    </div>

    <!-- secondary gene rarity -->
    <div class="col-12 col-sm-6 col-md-4">
        <div class="box">

            <div>Secondary Rarity</div>
            <form id="sec-rarity">
                <input type="checkbox" name="rarity" value="common">
                <label for="common">Common</label>
                <br>
                <input type="checkbox" name="rarity" value="uncommon">
                <label for="uncommon">Uncommon</label>
                <br>
                <input type="checkbox" name="rarity" value="limited">
                <label for="limited">Limited</label>
                <br>
                <input type="checkbox" name="rarity" value="rare">
                <label for="rare">Rare</label>
            </form>

        </div>
    </div>

    <!-- tertiary gene rarity -->
    <div class="col-12 col-sm-6 col-md-4">
        <div class="box">

            <div>Tertiary Rarity</div>
            <form id="tert-rarity">
                <input type="checkbox" name="rarity" value="common">
                <label for="common">Common</label>
                <br>
                <input type="checkbox" name="rarity" value="uncommon">
                <label for="uncommon">Uncommon</label>
                <br>
                <input type="checkbox" name="rarity" value="limited">
                <label for="limited">Limited</label>
                <br>
                <input type="checkbox" name="rarity" value="rare">
                <label for="rare">Rare</label>
            </form>

        </div>
    </div>
    
</div>

<script src="script.js"></script>


<!-- Bootstrap supplementals (possibly not needed?) -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
</body>
</html>
