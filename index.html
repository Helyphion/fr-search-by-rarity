<!DOCTYPE html>

<html data-bs-theme="dark">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

<title>FR Search by Rarity</title>
<!-- TODO: make a proper icon.. eventually -->
<link rel="icon" href="favicon.ico">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<style>
body {
    background-color: #24273a;
    color: #cad3f5;
    font-family: arial;
    max-width: 50rem; 
    margin: auto;
    /*transform: skewX(-1deg);   sometimes I just feel evil..*/
}

.box {
    border: 0.1rem solid #8087a2;
    background-color: #1e2030;
    padding: 0.5rem;
    margin: 0.5rem;
    height: 13rem;
}

.title {
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: -1px;
    padding-bottom: 0.3rem;
    margin-bottom: 0.5rem;
    border-bottom: 0.1rem solid #8087a2;
    color: #f5a97f;
    padding-left: 0.1rem;
}

.option {
    margin-bottom: -0.2rem;
    margin-left: 0.4rem;
}

.nav-pills .nav-link {
    color: #8087a2;
    padding: 0.2rem;
    margin-bottom: -0.1rem;
}

.nav-pills .nav-link.active {
  color: #1e2030;
  background-color: #f5a97f;
}
</style>
</head>



<body>

<!-- first row of boxes-->
<div class="row g-0">

    <!-- intro text -->
    <div class="col-12 col-sm-6 col-md-4">
        <div class="box">
            info
            
        </div>
    </div>

    <!-- utility toggles -->
    <div class="col-12 col-sm-6 col-md-4">
        <div class="box">
            
            <div class="title">Utilities</div>

            <form id="utilities">
                <div class="option">
                    <input type="checkbox" name="gender" value="male" checked="true"> <label for="male">Male</label>
                </div>
                <div class="option">
                    <input type="checkbox" name="gender" value="female" checked="true"> <label for="female">Female</label>
                </div>
                <hr style="margin:0.5rem 0rem;">
                <div class="option">
                    <input type="checkbox" name="g1" value="include"> <label for="include">Include G1s</label>
                </div>
                <hr style="margin:0.5rem 0rem;">
                <div class="option">
                    <input type="checkbox" name="breeding-status" value="rtb"> <label for="rtb">Ready to breed only</label>
                </div>
            </form>
            
        </div>
    </div>

    <!-- breed rarity -->
    <div class="col-12 col-sm-6 col-md-4">
        <div class="box">

            <div class="title">Breeds</div>

            <nav class="nav nav-pills nav-justified mx-1">
                  <a class="nav-link active" data-bs-toggle="pill" href="#modern">Modern</a>
                  <a class="nav-link" data-bs-toggle="pill" href="#ancient">Ancient</a>
            </nav>
            
            <!-- modern breed selector -->
            <div class="tab-content mt-2">
                <div class="tab-pane active" id="modern">
                    
                    <form id="breed-rarity">

                        <div class="option">
                            <input type="checkbox" name="rarity" value="plentiful"> <label for="plentiful">Plentiful</label>
                        </div>
                        <div class="option">
                            <input type="checkbox" name="rarity" value="common"> <label for="common">Common</label>
                        </div>
                        <div class="option">
                            <input type="checkbox" name="rarity" value="uncommon"> <label for="uncommon">Uncommon</label>
                        </div>
                        <div class="option">
                            <input type="checkbox" name="rarity" value="limited"> <label for="limited">Limited</label>
                        </div>
                        <div class="option">
                            <input type="checkbox" name="rarity" value="rare"> <label for="rare">Rare</label>
                        </div>
                        
                    </form>

                </div>

                <!-- ancient breed selector -->
                <div class="tab-pane" id="ancient" style="max-height:7rem; overflow:auto">
                    
                    <form id="ancient-breed">

                        <div class="option">
                            <input type="radio" name="breed" value="aberration"> <label for="aberration">Aberration</label>
                        </div>
                        <div class="option">
                            <input type="radio" name="breed" value="aether"> <label for="aether">Aether</label>
                        </div>
                        <div class="option">
                            <input type="radio" name="breed" value="auraboa"> <label for="auraboa">Auraboa</label>
                        </div>
                        <div class="option">
                            <input type="radio" name="breed" value="banescale"> <label for="banescale">Banescale</label>
                        </div>
                        <div class="option">
                            <input type="radio" name="breed" value="cirrus"> <label for="cirrus">Cirrus</label>
                        </div>
                        <div class="option">
                            <input type="radio" name="breed" value="dusthide"> <label for="dusthide">Dusthide</label>
                        </div>
                        <div class="option">
                            <input type="radio" name="breed" value="everlux"> <label for="everlux">Everlux</label>
                        </div>
                        <div class="option">
                            <input type="radio" name="breed" value="gaoler"> <label for="gaoler">Gaoler</label>
                        </div>
                        <div class="option">
                            <input type="radio" name="breed" value="sandsurge"> <label for="sandsurge">Sandsurge</label>
                        </div>
                        <div class="option">
                            <input type="radio" name="breed" value="thorntail"> <label for="thorntail">Thorntail</label>
                        </div>
                        <div class="option">
                            <input type="radio" name="breed" value="undertide"> <label for="undertide">Undertide</label>
                        </div> 
                        <div class="option">
                            <input type="radio" name="breed" value="veilspun"> <label for="veilspun">Veilspun</label>
                        </div>
                        <div class="option">
                            <input type="radio" name="breed" value="vigil"> <label for="vigil">Vigil</label>
                        </div>

                    </form>
                    
                </div>
            </div>

        </div>
    </div>


    <!-- primary gene rarity -->
    <div class="col-12 col-sm-6 col-md-4">
        <div class="box">

            <div class="title">Primary Rarity</div>
            <form id="prim-rarity">

                <div class="option">
                    <input type="checkbox" name="rarity" value="common"> <label for="common">Common</label>
                </div>
                <div class="option">
                    <input type="checkbox" name="rarity" value="uncommon"> <label for="uncommon">Uncommon</label>
                </div>
                <div class="option">
                    <input type="checkbox" name="rarity" value="limited"> <label for="limited">Limited</label>
                </div>
                <div class="option">
                    <input type="checkbox" name="rarity" value="rare"> <label for="rare">Rare</label>
                </div>
                <hr style="margin:0.5rem 0rem;">
                <div class="option">
                    <input type="checkbox" name="rarity" value="basic"> <label for="basic">Basic</label>
                </div>
                
            </form>

        </div>
    </div>

    <!-- secondary gene rarity -->
    <div class="col-12 col-sm-6 col-md-4">
        <div class="box">

            <div class="title">Secondary Rarity</div>
            <form id="sec-rarity">

                <div class="option">
                    <input type="checkbox" name="rarity" value="common"> <label for="common">Common</label>
                </div>
                <div class="option">
                    <input type="checkbox" name="rarity" value="uncommon"> <label for="uncommon">Uncommon</label>
                </div>
                <div class="option">
                    <input type="checkbox" name="rarity" value="limited"> <label for="limited">Limited</label>
                </div>
                <div class="option">
                    <input type="checkbox" name="rarity" value="rare"> <label for="rare">Rare</label>
                </div>
                <hr style="margin:0.5rem 0rem;">
                <div class="option">
                    <input type="checkbox" name="rarity" value="basic"> <label for="basic">Basic</label>
                </div>
                
            </form>

        </div>
    </div>

    <!-- tertiary gene rarity -->
    <div class="col-12 col-sm-6 col-md-4">
        <div class="box">

            <div class="title">Tertiary Rarity</div>
            <form id="tert-rarity">

                <div class="option">
                    <input type="checkbox" name="rarity" value="common"> <label for="common">Common</label>
                </div>
                <div class="option">
                    <input type="checkbox" name="rarity" value="uncommon"> <label for="uncommon">Uncommon</label>
                </div>
                <div class="option">
                    <input type="checkbox" name="rarity" value="limited"> <label for="limited">Limited</label>
                </div>
                <div class="option">
                    <input type="checkbox" name="rarity" value="rare"> <label for="rare">Rare</label>
                </div>
                <hr style="margin:0.5rem 0rem;">
                <div class="option">
                    <input type="checkbox" name="rarity" value="basic"> <label for="basic">Basic</label>
                </div>
                
            </form>

        </div>
    </div>
    
</div>

<button type="button" class="btn btn-outline-secondary">Search</button>
<div id="testing">result</div>

<script src="script.js"></script>
<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
