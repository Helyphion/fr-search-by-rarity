<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

<title>FR Search by Rarity</title>
<!-- TODO: make a proper icon.. eventually -->
<link rel="icon" href="favicon.ico">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<style>
body {
    background-color: #24273a;
    color: #cad3f5;
    font-family: arial;
    max-width: 50rem; 
    margin: auto;
    /*transform: skewX(-1deg);   sometimes I just feel evil..*/
}

.box {
    border: 0.1rem solid #8087a2;
    background-color: #1e2030;
    padding: 0.5rem;
    margin: 0.5rem;
}

.title {
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: -1px;
    padding-bottom: 0.3rem;
    margin-bottom: 0.6rem;
    border-bottom: 0.1rem solid #8087a2;
    color: #f5a97f;
}

.option {
    margin-bottom: -0.2rem;
    margin-left: 0.2rem;
}
</style>
</head>



<body>

    <ul class="nav nav-pills">
        <li class="nav-item">
          <a class="nav-link active" data-bs-toggle="pill" href="#home">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-bs-toggle="pill" href="#menu1">Menu 1</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-bs-toggle="pill" href="#menu2">Menu 2</a>
        </li>
      </ul>
      
      <!-- Tab panes -->
      <div class="tab-content">
        <div class="tab-pane container active" id="home">...</div>
        <div class="tab-pane container fade" id="menu1">e</div>
        <div class="tab-pane container fade" id="menu2">...</div>
      </div>

<!-- first row of boxes-->
<div class="row g-0">

    <!-- intro text -->
    <div class="col-12 col-sm-6 col-md-4">
        <div class="box">
            info
            
        </div>
    </div>

    <!-- utility toggles -->
    <div class="col-12 col-sm-6 col-md-4">
        <div class="box">
            util
        </div>
    </div>

    <!-- breed rarity -->
    <div class="col-12 col-sm-6 col-md-4">
        <div class="box">
            breeds

            
        </div>
    </div>


    <!-- primary gene rarity -->
    <div class="col-12 col-sm-6 col-md-4">
        <div class="box">

            <div class="title">Primary Rarity</div>
            <form id="prim-rarity">

                <div class="option">
                    <input type="checkbox" name="rarity" value="common"> <label for="common">Common</label>
                </div>
                <div class="option">
                    <input type="checkbox" name="rarity" value="uncommon"> <label for="uncommon">Uncommon</label>
                </div>
                <div class="option">
                    <input type="checkbox" name="rarity" value="limited"> <label for="limited">Limited</label>
                </div>
                <div class="option">
                    <input type="checkbox" name="rarity" value="rare"> <label for="rare">Rare</label>
                </div>
                
            </form>

        </div>
    </div>

    <!-- secondary gene rarity -->
    <div class="col-12 col-sm-6 col-md-4">
        <div class="box">

            <div class="title">Secondary Rarity</div>
            <form id="sec-rarity">

                <div class="option">
                    <input type="checkbox" name="rarity" value="common"> <label for="common">Common</label>
                </div>
                <div class="option">
                    <input type="checkbox" name="rarity" value="uncommon"> <label for="uncommon">Uncommon</label>
                </div>
                <div class="option">
                    <input type="checkbox" name="rarity" value="limited"> <label for="limited">Limited</label>
                </div>
                <div class="option">
                    <input type="checkbox" name="rarity" value="rare"> <label for="rare">Rare</label>
                </div>
                
            </form>

        </div>
    </div>

    <!-- tertiary gene rarity -->
    <div class="col-12 col-sm-6 col-md-4">
        <div class="box">

            <div class="title">Tertiary Rarity</div>
            <form id="tert-rarity">

                <div class="option">
                    <input type="checkbox" name="rarity" value="common"> <label for="common">Common</label>
                </div>
                <div class="option">
                    <input type="checkbox" name="rarity" value="uncommon"> <label for="uncommon">Uncommon</label>
                </div>
                <div class="option">
                    <input type="checkbox" name="rarity" value="limited"> <label for="limited">Limited</label>
                </div>
                <div class="option">
                    <input type="checkbox" name="rarity" value="rare"> <label for="rare">Rare</label>
                </div>
                
            </form>

        </div>
    </div>
    
</div>

<script src="script.js"></script>


<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
